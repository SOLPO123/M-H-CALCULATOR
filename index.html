<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MAN HOUR 계산기</title>
</head>
<body>

<div style="display:flex; gap:40px; align-items:flex-start;">

  <div>
    <h2>MAN HOUR 계산기</h2>

    <label>작업명</label><br>
    <input id="taskName" placeholder="예: 작업 A"><br><br>

    <label>MAN HOUR 입력</label><br>
    <input id="manHourHour" type="number" value="0"> 시간
    <input id="manHourMinute" type="number" value="0"> 분
    <br><br>

    <label>시작 시간</label><br>
    <input id="startTime" type="time" value="07:50"><br><br>

    <button onclick="addTask()">작업 추가</button>
    <button onclick="resetTasks()">전체 초기화</button>

    <h3>남은 작업 가능 시간</h3>
    <pre id="remainingTime"></pre>

    <label>작업 가능 시간 설정</label><br>
    <select id="totalWorkTime" onchange="updateDisplay()">
      <option value="420" selected>7시간 0분</option>
      <option value="390">6시간 30분</option>
      <option value="360">6시간 0분</option>
      <option value="330">5시간 30분</option>
      <option value="300">5시간 0분</option>
      <option value="270">4시간 30분</option>
      <option value="240">4시간 0분</option>
      <option value="210">3시간 30분</option>
      <option value="180">3시간 0분</option>
    </select>

    <h3>작업 목록</h3>
    <pre id="taskList"></pre>
  </div>

  <div style="border:1px solid black; padding:20px; min-width:430px; background:#f5f5f5;">
    <h2>일일 시간표</h2>

    <table border="1" cellpadding="8" style="border-collapse:collapse; width:100%;">
      <thead>
        <tr>
          <th>시간</th>
          <th>구분 / 작업명</th>
          <th>코드</th>
        </tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>

    <p>
      <b>Cf)</b><br>
      온라인 교육시간 : <b>N999</b><br>
      달별 3시간 / 분기 9시간
    </p>
  </div>

</div>

<script>
  const workBlocks = [
    { start: "07:50", end: "09:30" },
    { start: "09:45", end: "11:30" },
    { start: "12:30", end: "14:30" },
    { start: "14:45", end: "16:20" }
  ];

  const fixedBlocks = [
    { start: "07:30", end: "07:40", name: "회의시간", code: "I101" },
    { start: "07:40", end: "07:50", name: "작업준비", code: "I201" },
    { start: "09:30", end: "09:45", name: "휴게시간", code: "N301" },
    { start: "11:30", end: "12:30", name: "점심시간", code: "888" },
    { start: "14:30", end: "14:45", name: "휴게시간", code: "N301" },
    { start: "16:20", end: "종료", name: "청소시간", code: "N201" }
  ];

  let tasks = [];
  let usedMinutes = 0;

  function toMinutes(time) {
    if (time === "종료") return 9999;
    const [h, m] = time.split(":").map(Number);
    return h * 60 + m;
  }

  function toTime(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  }

  function formatMinutes(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h > 0 && m > 0) return h + "시간 " + m + "분";
    if (h > 0) return h + "시간";
    return m + "분";
  }

  function getSelectedTotalMinutes() {
    return Number(document.getElementById("totalWorkTime").value);
  }

  function allocateTime(startTime, minutesNeeded) {
    let remainingMinutes = minutesNeeded;
    let result = [];
    let startMinutes = toMinutes(startTime);

    for (const block of workBlocks) {
      let blockStart = toMinutes(block.start);
      let blockEnd = toMinutes(block.end);

      if (startMinutes > blockStart) {
        blockStart = startMinutes;
      }

      if (blockStart >= blockEnd) continue;

      let available = blockEnd - blockStart;

      if (remainingMinutes <= available) {
        result.push({
          start: toTime(blockStart),
          end: toTime(blockStart + remainingMinutes)
        });

        return {
          success: true,
          ranges: result,
          endTime: toTime(blockStart + remainingMinutes)
        };
      } else {
        result.push({
          start: toTime(blockStart),
          end: toTime(blockEnd)
        });

        remainingMinutes -= available;
      }
    }

    return { success: false };
  }

  function addTask() {
    const taskName = document.getElementById("taskName").value || "작업";
    const manHourHour = Number(document.getElementById("manHourHour").value);
    const manHourMinute = Number(document.getElementById("manHourMinute").value);
    const startTime = document.getElementById("startTime").value;

    const minutesNeeded = manHourHour * 60 + manHourMinute;
    const totalMinutes = getSelectedTotalMinutes();

    if (minutesNeeded <= 0) {
      alert("MAN HOUR를 입력하세요.");
      return;
    }

    if (usedMinutes + minutesNeeded > totalMinutes) {
      alert("설정한 작업 가능 시간을 초과했습니다.");
      return;
    }

    const allocation = allocateTime(startTime, minutesNeeded);

    if (!allocation.success) {
      alert("오늘 시간표상 작업 가능 시간을 초과했습니다.");
      return;
    }

    tasks.push({
      name: taskName,
      minutes: minutesNeeded,
      ranges: allocation.ranges,
      endTime: allocation.endTime
    });

    usedMinutes += minutesNeeded;

    document.getElementById("startTime").value = allocation.endTime;
    document.getElementById("taskName").value = "";
    document.getElementById("manHourHour").value = 0;
    document.getElementById("manHourMinute").value = 0;

    updateDisplay();
  }

  function renderSchedule() {
    let rows = [];

    fixedBlocks.forEach(block => {
      rows.push({
        start: block.start,
        end: block.end,
        name: block.name,
        code: block.code,
        type: "fixed"
      });
    });

    tasks.forEach(task => {
      task.ranges.forEach(r => {
        const duration = toMinutes(r.end) - toMinutes(r.start);

        rows.push({
          start: r.start,
          end: r.end,
          name: task.name + " (" + formatMinutes(duration) + ")",
          code: "-",
          type: "task"
        });
      });
    });

    rows.sort((a, b) => toMinutes(a.start) - toMinutes(b.start));

    let html = "";

    rows.forEach(row => {
      let bg = row.type === "task" ? "#d9ead3" : "#ffffff";

      html += `
        <tr style="background:${bg};">
          <td>${row.start} ~ ${row.end}</td>
          <td>${row.name}</td>
          <td>${row.code}</td>
        </tr>
      `;
    });

    document.getElementById("scheduleBody").innerHTML = html;
  }

  function updateDisplay() {
    const totalMinutes = getSelectedTotalMinutes();
    const remaining = totalMinutes - usedMinutes;

    document.getElementById("remainingTime").textContent =
      "설정 작업 가능 시간: " + formatMinutes(totalMinutes) + "\n" +
      "사용한 시간: " + formatMinutes(usedMinutes) + "\n" +
      "남은 시간: " + formatMinutes(remaining);

    let text = "";

    tasks.forEach((task, index) => {
      text += (index + 1) + ". " + task.name + "\n";
      text += "MAN HOUR: " + formatMinutes(task.minutes) + "\n";
      text += "배정 시간:\n";

      task.ranges.forEach(r => {
        const duration = toMinutes(r.end) - toMinutes(r.start);
        text += " - " + r.start + " ~ " + r.end + " (" + formatMinutes(duration) + ")\n";
      });

      text += "완료 시각: " + task.endTime + "\n\n";
    });

    document.getElementById("taskList").textContent = text;

    renderSchedule();
  }

  function resetTasks() {
    tasks = [];
    usedMinutes = 0;

    document.getElementById("startTime").value = "07:50";
    document.getElementById("taskName").value = "";
    document.getElementById("manHourHour").value = 0;
    document.getElementById("manHourMinute").value = 0;

    updateDisplay();
  }

  updateDisplay();
</script>

</body>
</html>
